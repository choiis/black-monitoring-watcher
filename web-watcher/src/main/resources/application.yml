server:
  port: 7030

spring:
  application:
    name: web-watcher
  cassandra:
    contact-points: [ "localhost" ]
    port: 9042
    keyspace-name: monitoring
    local-datacenter: datacenter1
    schema-action: none
  codec:
    max-in-memory-size: 1MB
  mail:
    host: localhost
    port: 1025
    username:
    password:
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

zookeeper:
  connect-string: localhost:2181

api-server:
  base-url: http://localhost:7080

selenium:
  pool-size: 5
  headless: true
