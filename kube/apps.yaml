apiVersion: v1
kind: Namespace
metadata:
  name: black-monitoring

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: bm-app-config
  namespace: black-monitoring
data:
  CASSANDRA_CONTACT_POINTS: "cassandra.black-monitoring.svc.cluster.local"
  CASSANDRA_PORT: "9042"
  ZOOKEEPER_CONNECT: "zookeeper.black-monitoring.svc.cluster.local:2181"
  MIMIR_URL: "http://mimir-gateway.black-monitoring.svc.cluster.local:10100"
  API_SERVER_BASE_URL: "http://api-server.black-monitoring.svc.cluster.local:7080"

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: black-monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
        - name: api-server
          image: black-monitoring-api-server:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7080
          envFrom:
            - configMapRef:
                name: bm-app-config
          env:
            - name: JAVA_TOOL_OPTIONS
              value: |
                -Dspring.cassandra.contact-points=cassandra.black-monitoring.svc.cluster.local     
                -Dzookeeper.connect-string=zookeeper.black-monitoring.svc.cluster.local:2181
                -Dapi-server.base-url=http://api-server.black-monitoring.svc.cluster.local:7080

---

apiVersion: v1
kind: Service
metadata:
  name: api-server
  namespace: black-monitoring
spec:
  type: LoadBalancer
  selector:
    app: api-server
  ports:
    - name: http
      port: 7080
      targetPort: 7080

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-watcher
  namespace: black-monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-watcher
  template:
    metadata:
      labels:
        app: api-watcher
    spec:
      containers:
        - name: api-watcher
          image: black-monitoring-api-watcher:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7010
          envFrom:
            - configMapRef:
                name: bm-app-config
          env:
            - name: JAVA_TOOL_OPTIONS
              value: |
                -Dspring.cassandra.contact-points=cassandra.black-monitoring.svc.cluster.local     
                -Dzookeeper.connect-string=zookeeper.black-monitoring.svc.cluster.local:2181
                -Dapi-server.base-url=http://api-server.black-monitoring.svc.cluster.local:7080


---

apiVersion: v1
kind: Service
metadata:
  name: api-watcher
  namespace: black-monitoring
spec:
  type: ClusterIP
  selector:
    app: api-watcher
  ports:
    - name: http
      port: 7010
      targetPort: 7010

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcp-watcher
  namespace: black-monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tcp-watcher
  template:
    metadata:
      labels:
        app: tcp-watcher
    spec:
      containers:
        - name: tcp-watcher
          image: black-monitoring-tcp-watcher:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7020
          envFrom:
            - configMapRef:
                name: bm-app-config
          env:
            - name: JAVA_TOOL_OPTIONS
              value: |
                -Dspring.cassandra.contact-points=cassandra.black-monitoring.svc.cluster.local     
                -Dzookeeper.connect-string=zookeeper.black-monitoring.svc.cluster.local:2181
                -Dapi-server.base-url=http://api-server.black-monitoring.svc.cluster.local:7080

---

apiVersion: v1
kind: Service
metadata:
  name: tcp-watcher
  namespace: black-monitoring
spec:
  type: ClusterIP
  selector:
    app: tcp-watcher
  ports:
    - name: http
      port: 7020
      targetPort: 7020
